[package]
name = "kring-core"
version.workspace = true
edition.workspace = true

[dependencies]
oo7 = { version = "0.7.1", default-features = false, features = ["tokio", "native_crypto", "unstable"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
thiserror = "2"
zeroize = "1.9"
age = { version = "0.12", default-features = false }
sha2 = "0.11.1"
hex = "0.4.3"
serde_json = "1.0.154"
time = { version = "0.3", default-features = false, features = ["formatting", "parsing", "std"] }
base64 = "0.22"
serde = { version = "1.0.229", features = ["derive"] }
# KWallet wallet files: Blowfish CBC, PBKDF2-SHA512 key, SHA-1 integrity hash.
blowfish = { version = "0.10.0", features = ["zeroize"] }
sha1 = "0.11"
pbkdf2 = "0.13"
libc = "0.2"
# SSH key files (OpenSSH formats); no GUI or system crypto libraries.
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519", "p256", "p384", "rsa", "encryption", "getrandom"] }

[features]
fake = []
# Session guard for integration tests and dev tools.
dev = []

[dev-dependencies]
# Enables the `dev` feature for this crate's integration tests and examples.
kring-core = { path = ".", features = ["dev"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
