[package]
name = "kring"
version.workspace = true
edition.workspace = true

[dependencies]
kring-core = { path = "../kring-core" }
eframe = "0.37"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
arboard = "3.7"
zeroize = "1.9"
time = { version = "0.3", default-features = false, features = ["std", "parsing", "local-offset"] }

[dev-dependencies]
kring-core = { path = "../kring-core", features = ["fake", "dev"] }
tempfile = "3"
async-trait = "0.1"
